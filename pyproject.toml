[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpulse"
version = "0.1.0"
description = "A dependency-light quantum computing toolkit: statevector simulation, canonical algorithms (QFT, Grover, Deutsch-Jozsa, QAOA, VQE), and pulse-level transmon control with Lindblad noise and DRAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Kyaw Kyaw Woo" },
]
keywords = [
  "quantum-computing",
  "statevector-simulator",
  "quantum-algorithms",
  "qft",
  "grover",
  "qaoa",
  "vqe",
  "pulse-control",
  "drag",
  "transmon",
  "lindblad",
  "numpy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
quantpulse = "quantpulse.cli:main"

[project.urls]
Homepage = "https://github.com/MrKyaw/Quant-Pulse-Processor"
Issues = "https://github.com/MrKyaw/Quant-Pulse-Processor/issues"
Changelog = "https://github.com/MrKyaw/Quant-Pulse-Processor/blob/main/CHANGELOG.md"
Architecture = "https://github.com/MrKyaw/Quant-Pulse-Processor/blob/main/docs/ARCHITECTURE.md"
Method = "https://github.com/MrKyaw/Quant-Pulse-Processor/blob/main/docs/METHOD.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantpulse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not slow'"
filterwarnings = ["error::RuntimeWarning"]
markers = [
  "slow: benchmarks that sweep circuit sizes",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905", "RUF001"]

[tool.coverage.run]
source = ["quantpulse"]
branch = true


[tool.ruff.lint.per-file-ignores]
"src/quantpulse/gates.py" = ["E741"]
