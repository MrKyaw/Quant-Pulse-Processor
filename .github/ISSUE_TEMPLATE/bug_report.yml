name: Bug report
description: Report a numerical, algorithmic or interface problem.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For numerical issues,
        please include the smallest snippet that reproduces it.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code or CLI commands that reproduce the behaviour.
      render: python
      placeholder: |
        from quantpulse import Circuit
        print(Circuit(2).h(0).cnot(0, 1).probabilities())
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect, and why? Cite an equation if relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Traceback, numbers, or the failing test output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `quantpulse info`.
      render: shell
      placeholder: |
        version: 0.1.0
        python: 3.12.8
        numpy: 2.5.4
        platform: ...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I checked the conventions in docs/METHOD.md.
          required: true
