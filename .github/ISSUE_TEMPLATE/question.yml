name: Question
description: Ask about usage, conventions or the physics.
title: "[question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do or understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Code, commands, or links to the section you are reading.
      render: python
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include the output of `quantpulse info` if the question is environment-specific.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the README, docs/METHOD.md and docs/ARCHITECTURE.md.
          required: true
        - label: I searched existing issues.
          required: true
